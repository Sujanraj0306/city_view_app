services:
  postgres:
    image: postgres:15-alpine
    container_name: civicshield-postgres
    environment:
      POSTGRES_DB: civicshield
      POSTGRES_USER: ${POSTGRES_USER:-civicshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicshield}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - civicshield-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicshield} -d civicshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: civicshield-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - civicshield-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: civicshield-kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - civicshield-net

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: civicshield-namenode
    environment:
      - CLUSTER_NAME=civicshield-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_namenode_name_dir=file:///hadoop/dfs/name
    ports:
      - "19870:9870"
      - "19000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - civicshield-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: civicshield-datanode
    depends_on:
      - namenode
    environment:
      - CLUSTER_NAME=civicshield-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
      - SERVICE_PRECONDITION=namenode:9870
    ports:
      - "19864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - civicshield-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicshield-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civicshield}:${POSTGRES_PASSWORD:-civicshield}@postgres:5432/civicshield
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HDFS_NAMENODE: hdfs://namenode:9000
      AI_SERVICE_URL: http://ai-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      namenode:
        condition: service_started
    networks:
      - civicshield-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: civicshield-ai-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HDFS_NAMENODE: hdfs://namenode:9000
    volumes:
      - ai_models:/app/models
    depends_on:
      - kafka
      - namenode
    networks:
      - civicshield-net

volumes:
  postgres_data:
  hadoop_namenode:
  hadoop_datanode:
  ai_models:

networks:
  civicshield-net:
    driver: bridge
